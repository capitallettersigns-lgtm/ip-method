<style>
:root{--bg:#0b0f16;--bg2:#121824;--card:#161e2c;--card2:#1c2638;--line:#263248;--tx:#e6edf6;--mut:#8b9ab3;--acc:#22d3a6;--acc2:#a3e635;--warn:#f5b942;--bad:#f2555a;--info:#5aa9ff;--r:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
/* App shell: body is a fixed full-screen column; only <main> scrolls, so header + tab bar can never drift (iOS standalone) */
body{position:fixed;inset:0;height:100%;overflow:hidden;display:flex;flex-direction:column;overscroll-behavior:none}
header.top{flex:none;position:relative;z-index:20;background:rgba(11,15,22,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(var(--safe-t) + 10px) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header.top h1{font-size:19px;margin:0;font-weight:750;letter-spacing:.2px;flex:1}
header.top .sub{color:var(--mut);font-size:13px}
main{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-padding:12px 0 24px;padding:14px max(14px, calc((100% - 720px) / 2 + 14px)) 28px;width:100%}
nav.tabs{flex:none;position:relative;z-index:30;display:flex;background:rgba(18,24,36,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
nav.tabs button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--acc)}
h2{font-size:22px;margin:6px 2px 12px;font-weight:750}
h3{font-size:16px;margin:18px 2px 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card.hl{border-color:rgba(34,211,166,.45)}
.card.rot{border-color:rgba(242,85,90,.7);box-shadow:0 0 0 1px rgba(242,85,90,.25) inset}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.small{font-size:13px}.tiny{font-size:12px}
.b{font-weight:700}
.exname{font-size:18px;font-weight:750;line-height:1.25}
.slot{font-size:12px;font-weight:800;color:var(--bg);background:var(--mut);border-radius:8px;padding:3px 7px;letter-spacing:.5px}
.slot.k{background:var(--acc)}.slot.s{background:var(--info)}.slot.a{background:#6b7a93}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.badge.Anchor{color:#7dd3fc;border-color:#1f4d66;background:#0f2533}
.badge.Reinforce{color:#fbbf24;border-color:#5c4613;background:#2a200a}
.badge.Transfer{color:#c4b5fd;border-color:#43386e;background:#1d1833}
.badge.jon{color:var(--acc2);border-color:#3f5a17;background:#1a2409}
.st{font-size:12px;font-weight:800;border-radius:8px;padding:4px 8px;letter-spacing:.3px;white-space:nowrap}
.st.START,.st.PROGRESSING{background:rgba(34,211,166,.14);color:var(--acc)}
.st.WATCH{background:rgba(245,185,66,.15);color:var(--warn)}
.st.ROTATE{background:rgba(242,85,90,.18);color:var(--bad)}
.st.NEW{background:#22304a;color:var(--mut)}
.st.ADD{background:rgba(163,230,53,.15);color:var(--acc2)}
.targets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.tgt{background:var(--bg2);border-radius:12px;padding:9px 11px}
.tgt .l{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.tgt .v{font-size:20px;font-weight:800}
.tgt .v small{font-size:13px;color:var(--mut);font-weight:600}
.set{display:grid;grid-template-columns:50px 1fr 1fr 46px;gap:7px;align-items:center;margin-top:10px}
.set .lab{font-size:12px;font-weight:800;color:var(--mut);line-height:1.15}
.num{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:52px}
.num input{flex:1;min-width:0;width:100%;background:none;border:0;color:var(--tx);font-size:19px;font-weight:750;text-align:center;padding:0;height:100%;-moz-appearance:textfield}
.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num input::placeholder{color:#4d5c76}
.num button{width:30px;flex:none;height:100%;background:none;border:0;color:var(--mut);font-size:22px;font-weight:600}
.num button:active{background:var(--card2)}
.num .u{display:none}
.sethead{display:grid;grid-template-columns:50px 1fr 1fr 46px;gap:7px;margin-top:12px;font-size:11px;font-weight:800;color:var(--mut);text-align:center;letter-spacing:.6px}
.chk{width:46px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--mut);display:flex;align-items:center;justify-content:center}
.chk svg{width:24px;height:24px;stroke:currentColor;stroke-width:3;fill:none}
.chk.on{background:var(--acc);border-color:var(--acc);color:#05261d}
button.btn{appearance:none;border:0;border-radius:14px;background:var(--card2);color:var(--tx);font-weight:700;font-size:16px;padding:14px 16px;min-height:50px;border:1px solid var(--line)}
button.btn.pri{background:linear-gradient(135deg,var(--acc),#16b88f);color:#04221a;border:0}
button.btn.dan{background:rgba(242,85,90,.15);color:var(--bad);border-color:rgba(242,85,90,.4)}
button.btn.rotbtn{background:var(--bad);color:#fff;border:0}
button.btn.sm{font-size:14px;padding:8px 12px;min-height:38px;border-radius:11px}
button.btn.full{width:100%}
button.link{background:none;border:0;color:var(--acc);font-weight:700;font-size:14px;padding:6px 0}
.btns{display:flex;gap:10px;margin-top:12px}.btns>*{flex:1}
.daypick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.daypick button{background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--tx);padding:16px 8px;text-align:center}
.daypick button .d{font-size:30px;font-weight:850}
.daypick button.sug{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.daypick button .s{font-size:12px;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);background:var(--bg2);border-radius:999px;padding:4px 10px}
details{background:var(--bg2);border-radius:12px;padding:0 12px;margin-top:10px}
details summary{padding:10px 0;font-weight:700;font-size:14px;color:var(--mut);cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"＋";float:right}
details[open] summary:after{content:"－"}
details>div{padding:0 0 12px;font-size:14px}
.banner{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.banner.bad{background:rgba(242,85,90,.12);border:1px solid rgba(242,85,90,.35)}
.banner.warn{background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.3)}
.banner.ok{background:rgba(34,211,166,.1);border:1px solid rgba(34,211,166,.3)}
.banner.info{background:rgba(90,169,255,.1);border:1px solid rgba(90,169,255,.3)}
label.f{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 6px}
input.t,select.t,textarea.t{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--tx);font-size:17px;padding:12px;font-family:inherit}
select.t{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.t{min-height:70px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:650}
.chip.on{background:var(--acc);border-color:var(--acc);color:#04221a}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--tx);padding:12px 14px;margin:0 0 9px;font-size:15px}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.opt .r{font-weight:750}
.opt .d{color:var(--mut);font-size:13.5px;margin-top:3px}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px;margin-top:8px}
.chain .arr{color:var(--mut)}
.chain .n{background:var(--bg2);border-radius:9px;padding:5px 8px}
.chain .n.cur{outline:1px solid var(--acc)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{color:var(--mut);font-weight:700;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid #1d2638;vertical-align:top}
.tblwrap{overflow-x:auto;margin:0 -4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--mut)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#121824;width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + var(--safe-b));border-top:1px solid var(--line)}
.sheet.anim{animation:up .2s ease-out}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:#34425c;margin:4px auto 10px}
.sheet h2{margin-top:2px}
.steps{display:flex;gap:6px;margin:0 0 12px}.steps i{flex:1;height:4px;border-radius:2px;background:#2a3650}.steps i.on{background:var(--acc)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.timer{position:fixed;right:12px;top:calc(var(--safe-t) + 10px);z-index:40;background:var(--acc);color:#04221a;font-weight:850;font-size:16px;border-radius:999px;padding:8px 13px;box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;gap:8px;align-items:center;border:0}
.timer.done{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe-b));background:#2a3650;color:var(--tx);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;font-weight:650;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:4px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.rank{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #1d2638;font-size:14px}
.rank:last-child{border:0}
.rank .n{width:26px;height:26px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.rank .n.g{background:var(--acc2);color:#1a2409}
.prose p{margin:0 0 10px}.prose li{margin-bottom:6px}.prose ul,.prose ol{padding-left:20px;margin:0 0 10px}
.stars{display:flex;gap:6px}.stars button{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:18px;font-weight:800}.stars button.on{background:var(--warn);color:#2a1d02;border-color:var(--warn)}
.hr{height:1px;background:var(--line);margin:12px 0}
.calc{background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:8px}

/* tap reliability on iOS */
button,[data-act],[data-tab]{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(34,211,166,.15)}
.sessbar{display:flex;gap:8px;justify-content:space-between;margin-bottom:12px}
.sessbar .btn{flex:1}
button.prow{width:100%;text-align:left;color:var(--tx);font:inherit;align-items:center}
/* whole button is the touch target: children never become the tap target */
button *{pointer-events:none}

.tgt .plates{color:var(--acc);font-weight:600;margin:1px 0 2px}
.why{margin:8px 0 2px;padding:7px 10px;border-radius:10px;background:var(--card2);color:var(--mut);line-height:1.35}.why b{color:var(--tx)}

</style>
</head>

  const parts = [];
  const kgs = [0, 1].map(k => {
    const b = lastBo[k], w = b && isNum(b[0]) ? b[0] : null, r = b && isNum(b[1]) ? b[1] : null;
    if (!isNum(w) || !isNum(r)) { parts.push(`set ${k + 1}: ${asst ? 'same assistance as the top set' : '~80% of ' + kgf(topKg)} → ${kgf(base)}`); return base; }
    const was = setTxt(w, r);
    if (r >= sl.top + 3) {
      let up = bar ? barRound(w + inc) : r2(w + inc), via = `+${kgf(inc)}`;
      const e = asst ? null : e1rm(w, r), c = isNum(e) ? (bar ? barFloor(startFromE1(e, sl.top)) : startFromE1(e, sl.top)) : null;
      if (isNum(c) && c > up) { up = c; via = `e1RM ${kgf(e)} → ${kgf(c)}`; }
      if (!asst && base > up) { up = base; via = `~80% of ${kgf(topKg)} = ${kgf(base)}`; }
      parts.push(`set ${k + 1}: ${was}, well above ${sl.top} → ${via}${asst ? ' (less assistance)' : ''}`); return fix(up);
    }
    if (r < sl.bottom) { parts.push(`set ${k + 1}: ${was}, below ${sl.bottom} → −${kgf(inc)}`); return fix(bar ? barFloor(w - inc) : w - inc); }
    if (asst) { parts.push(`set ${k + 1}: ${was}, in range → ${kgf(inc)} kg less assistance`); return fix(w + inc); }
    if (base > w) { parts.push(`set ${k + 1}: ${was}, in range → ~80% of ${kgf(topKg)} = ${kgf(base)}`); return fix(base); }
    parts.push(`set ${k + 1}: ${was}, in range → hold`); return fix(w);
  });
  const same = parts.length === 2 && kgs[0] === kgs[1] && parts[0].slice(7) === parts[1].slice(7);
  return {kg:kgs[0], kgs, why: same ? 'Both sets: ' + parts[0].slice(7) : parts.join('; ')};
}
/* Accessories: double progression, per set. Every set at the top of the range → + increment; otherwise same kg, more reps. */
function planAcc(id) {
  const sl = S.slots[id], logs = S.logs.filter(l => l.slot === id && l.sets).sort(byDate), last = logs[logs.length - 1];
  if (!last) return {sets:isNum(sl.kg) ? [sl.kg, sl.kg] : [null, null], why:'', up:false};
  const ss = last.sets.filter(s => isNum(s[1]));
  const up = ss.length > 0 && ss.every(s => s[1] >= sl.top);
  const kgs = [0, 1].map(k => { const s = last.sets[k] || last.sets[0], w = s && isNum(s[0]) ? s[0] : sl.kg; return isNum(w) ? (up ? r2(w + sl.inc) : w) : null; });
  const lt = last.sets.map(s => setTxt(s[0], s[1])).join(', ');
  return {sets:kgs, up, why: up ? `Last time ${lt} – every set hit ${sl.top}, so +${kgf(sl.inc)} kg` : `Last time ${lt} – same weight, beat those reps until every set hits ${sl.top}`};
}

function slotInfo(id) {
  const sl = S.slots[id], def = SLOTDEF[id];
  if (isAcc(id)) {
    const logs = S.logs.filter(l => l.slot === id).sort(byDate);
    const last = logs[logs.length - 1];
    let status = 'NEW';
    if (last && last.sets) status = last.sets.every(s => isNum(s[1]) && s[1] >= sl.top) ? 'ADD WEIGHT' : 'BUILD REPS';
    const pa = planAcc(id);
    return {sl, def, logs, last, status, target:sl.kg, acc:true, sets:pa.sets, why:pa.why};
  }
  const lc = LC(sl.lc); const ev = evalLc(sl.lc); const last = ev[ev.length - 1];
  const status = last ? last.status : 'NEW';
  const ex = lc.ex || sl.ex, target = last ? last.next : barMin(ex, lc.startKg);
  const bp = planBo(id, target, last && last.log);
  return {sl, def, lc, ev, last, status, rotate:status.startsWith('ROTATE'), target, wk:ev.length + 1, why:last ? last.why : (isNum(target) ? 'Week 1 start weight' : ''),
    backoff:bp.kg, bos:bp.kgs, boWhy:bp.why, pull:isPullUp(sl.ex), assist:isAssisted(ex), barbell:isBarbell(ex)};
}
const stCls = s => s.startsWith('ROTATE') ? 'ROTATE' : s.startsWith('WATCH') ? 'WATCH' : s === 'ADD WEIGHT' ? 'ADD' : (s === 'NEW' || s === 'BUILD REPS') ? 'NEW' : s;
const stLabel = s => s === 'NEW' ? 'NOT STARTED' : s.replace(' - ', ' · ');

function lcSummary(lc) {
  const rows = lcLogs(lc.id);
  if (!rows.length) return {lc, n:0};
  const f = rows[0], l = rows[rows.length - 1];
  const s1 = e1rm(f.kg, f.reps), e1 = e1rm(l.kg, l.reps);
  const weeks = Math.round(daysBetween(f.date, l.date) / 7) + 1;
  const gain = (isNum(s1) && isNum(e1)) ? r1(e1 - s1) : (isNum(f.kg) && isNum(l.kg) && (f.kg < 0 || l.kg < 0)) ? r2(l.kg - f.kg) : null;   // assisted: kg of assistance removed
  return {lc, n:rows.length, start:f.date, end:l.date, weeks, sKg:f.kg, sReps:f.reps, s1, eKg:l.kg, eReps:l.reps, e1, gain,
    kgGain:r2(l.kg - f.kg), perWk:(isNum(gain) && weeks > 0) ? r2(gain / weeks) : null};
}

function best3(pattern) {
  const g = {};
  S.lifecycles.filter(l => l.closed && l.pattern === pattern).map(lcSummary).filter(s => isNum(s.gain)).forEach(s => {
    const k = s.lc.ex; g[k] = g[k] || {ex:k, best:-Infinity, n:0, ratings:[]};
    g[k].best = Math.max(g[k].best, s.gain); g[k].n++; if (s.lc.rating) g[k].ratings.push(s.lc.rating);
  });
  return Object.values(g).sort((a, b) => b.best - a.best).slice(0, 3)
    .map(x => ({...x, avg: x.ratings.length ? r1(x.ratings.reduce((a, b) => a + b, 0) / x.ratings.length) : null}));
}

/* Next exercise – mirrors the Tracker's 'Suggested next exercise' + Decision Tree */
function recommend(id, reason) {
  const sl = S.slots[id], lc = LC(sl.lc);
  if (lc.role === 'Transfer') {
    return {ex:sl.anchor, role:'Anchor', row:lc.treeRowId ? TREEBYID[lc.treeRowId] : null,
      why:'The Transfer lifecycle is finished, so go back to your anchor. Check how much stronger you are, whether the variations worked, and where the weak point is now.'};
  }
  if (lc.role === 'Reinforce') {
    let row = lc.treeRowId && TREEBYID[lc.treeRowId] && TREEBYID[lc.treeRowId].reinforce === lc.ex ? TREEBYID[lc.treeRowId] : null;
    if (!row) row = TREE.find(t => t.reinforce === lc.ex && t.ret === sl.anchor) || TREE.find(t => t.reinforce === lc.ex);
    if (row) return {ex:row.transfer, role:'Transfer', row,
      why:'The Reinforce lifecycle is finished. Move to its Transfer lift: still biased to the weak point but milder, so it carries the new strength back towards the anchor. No re-diagnosis needed.'};
    return {ex:null, role:'Transfer', row:null, why:'This Reinforce lift is not in the decision tree, so pick a Transfer lift yourself: still biased to the weak point, but closer to the anchor.'};
  }
  if (!reason) return null;
  const row = TREE.find(t => t.ex === lc.ex && t.reason === reason);
  if (row) return {ex:row.reinforce, role:'Reinforce', row, why:row.why};
  return {ex:null, role:'Reinforce', row:null,
    why:'Not in the tree for this exercise – diagnose and choose manually. Pick a variation that makes this weak point the limiting factor (reduce stability, restrict range, change tempo, or add pauses/dead stops).'};
}

function draftEntry(id) {

function chartSvg(pts, unit) {
  const W = 340, H = 176, pl = 34, pr = 10, pt = 20, pb = 24;
  const vals = pts.flatMap(p => [p.a, p.b]).filter(isNum);
  if (!vals.length) return '';
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mx - mn < 5) { mn -= 2.5; mx += 2.5; }
  const pad = (mx - mn) * 0.08; mn -= pad; mx += pad;
  const n = pts.length;
  const x = k => pl + (n === 1 ? (W - pl - pr) / 2 : k * (W - pl - pr) / (n - 1));
  const y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  let g = '';
  for (let t = 0; t <= 3; t++) { const v = mn + (mx - mn) * t / 3; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#223049"/><text x="${pl - 5}" y="${y(v) + 4}" fill="#6f7f9a" font-size="10" text-anchor="end">${Math.round(v)}</text>`; }
  pts.forEach((p, k) => { if (k > 0 && p.lc !== pts[k - 1].lc) { const xm = (x(k) + x(k - 1)) / 2; g += `<line x1="${xm}" x2="${xm}" y1="${pt}" y2="${H - pb}" stroke="#5a6b88" stroke-dasharray="3 3"/>`; } });
  const line = (key, col, dash) => {
    const segs = []; let d = '';
    pts.forEach((p, k) => { if (!isNum(p[key])) return; if (k > 0 && p.lc !== pts[k - 1].lc && d) { segs.push(d); d = ''; } d += (d ? 'L' : 'M') + x(k).toFixed(1) + ' ' + y(p[key]).toFixed(1); });
    if (d) segs.push(d);
    return segs.map(s => `<path d="${s}" fill="none" stroke="${col}" stroke-width="2.5" ${dash ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round"/>`).join('') +
      pts.map((p, k) => isNum(p[key]) ? `<circle cx="${x(k)}" cy="${y(p[key])}" r="3" fill="${col}"/>` : '').join('');
  };
  g += line('b', '#f5b942', true) + line('a', '#22d3a6', false);
  g += `<text x="${pl}" y="${H - 6}" fill="#6f7f9a" font-size="10">${fmtD(pts[0].d)}</text><text x="${W - pr}" y="${H - 6}" fill="#6f7f9a" font-size="10" text-anchor="end">${fmtD(pts[n - 1].d)}</text><text x="4" y="10" fill="#6f7f9a" font-size="9">${unit}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Top-set and estimated 1RM chart">${g}</svg>`;
}

function vMore() {
  setHeader('Guide', 'How the IP Method works');
  return `<h2>How it works</h2><div class="card prose small">
  <p>Jon Walland's <b>IP Method (Infinite Progression)</b> isn't a fixed programme. It's a way of deciding what to do when a lift stops going up.</p>
  <p><b>Patterns, not exercises.</b> The goal is to get stronger at six patterns – horizontal press and pull, vertical press and pull, squat and hinge. A single exercise is only a temporary tool: don't get attached to one, and don't swap out of boredom.</p>
  <p><b>Every exercise has a lifecycle.</b> A new lift climbs fast (mostly skill), then progresses steadily, then gets fragile, then stalls. Get the most out of the productive part and rotate before the stall drags on.</p>
  <p><b>Weekly progression (load-first).</b></p><ul>
  <li><b>Top set:</b> add the fixed jump every week regardless of how you feel. Lift powerfully; stop before form breaks or the range shortens.</li>
  <li><b>Two back-off sets</b> at ~80%: strict, controlled, to true target-muscle failure.</li>
  <li>Start at the <b>top</b> of the rep range (one AMRAP set + a 1RM estimate) and fight to keep the reps as the weight rises. Holding top-end reps for 2–4 weeks means the jump is right.</li></ul>
  <p><b>When to rotate.</b> When top-set reps hit the bottom of the range, or after <b>two weeks in a row without progress</b> (couldn't add weight, or matched the weight without more reps). One bad session isn't a plateau, and extra sets or looser form aren't the fix.</p>
  <p><b>Diagnose, then choose.</b> At failure, note where the bar slows, how form breaks and which muscle takes over. Pick a variation that targets that weak point – less stability, restricted range, a tempo change, or pauses/dead stops.</p>
  <p><b>Anchor → Reinforce → Transfer → Anchor.</b> The Anchor is your benchmark lift and exposes the weak point. Reinforce makes the weak point the limiter (you'll lift less). Transfer is a milder bridge back. Then return to the Anchor stronger and see where the weak point has moved. Each step runs a full lifecycle.</p>
  <p><b>The long game.</b> Record how long each lifecycle lasted and how much estimated 1RM it added. Over time keep the 2–3 variations per pattern that work best for you – History ranks them.</p></div>
  <h3>Using this app</h3><div class="card prose small"><ol>
  <li><b>Plan:</b> set each lift's week-1 top-set weight (the AMRAP helper suggests one).</li>

'use strict';
/* Optional GitHub sync (REST contents API, straight from the browser).
   Settings live under their own localStorage key, separate from the workout data (KEY),
   so the token never ends up in Export backups or in anything written to the repo. */
const SYNC_KEY = 'ipMethodJosh.sync.v1';
const GH_API = 'https://api.github.com';
let SYNC = {token:'', owner:'capitallettersigns-lgtm', repo:'ip-method-logs', lastSync:null, lastError:null, pending:{state:false, sessions:[]}, sessFiles:{}};
let syncTimer = null, syncBusy = false;

function syncLoad() {
  try { const raw = localStorage.getItem(SYNC_KEY); if (raw) SYNC = Object.assign(SYNC, JSON.parse(raw)); } catch (e) { /* keep defaults */ }
  if (!SYNC.pending) SYNC.pending = {state:false, sessions:[]};
  if (!SYNC.sessFiles || typeof SYNC.sessFiles !== 'object') SYNC.sessFiles = {};   // path -> hash of the content last written
}
function syncSave() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(SYNC)); } catch (e) { /* ignore */ } }
const syncOn = () => !!(SYNC.token && SYNC.owner && SYNC.repo);

class SyncError extends Error { constructor(kind, msg, status) { super(msg); this.kind = kind; this.status = status; } }
const AUTH_MSG = 'Token invalid or missing permission. Check it has access to the repo with Contents = Read and write, and hasn’t expired.';

function b64utf8(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function gh(method, path, body, accept) {
  if (typeof navigator !== 'undefined' && navigator.onLine === false) throw new SyncError('offline', 'You’re offline – will retry when back online.');
  let res;
  try {
    res = await fetch(GH_API + path, {method, cache:'no-store', headers:{
      'Authorization':'Bearer ' + SYNC.token, 'Accept':accept || 'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28', ...(body ? {'Content-Type':'application/json'} : {})},
      body: body ? JSON.stringify(body) : undefined});
  } catch (e) { throw new SyncError('offline', 'Couldn’t reach GitHub (offline?) – will retry later.'); }
  if (res.status === 401 || res.status === 403) throw new SyncError('auth', AUTH_MSG, res.status);
  return res;
}
const contentsPath = p => `/repos/${encodeURIComponent(SYNC.owner)}/${encodeURIComponent(SYNC.repo)}/contents/${p.split('/').map(encodeURIComponent).join('/')}`;
function unb64utf8(b64) { try { const bin = atob(String(b64).replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); } catch (e) { return null; } }
async function getRemote(path) {
  const r = await gh('GET', contentsPath(path));
  if (r.status === 404) return null;
  if (!r.ok) throw new SyncError('http', 'GitHub error ' + r.status + ' reading ' + path, r.status);
  const j = await r.json(); return {sha:j.sha || null, text:j.content != null ? unb64utf8(j.content) : null};
}
/* GET sha -> PUT; 404 = create; 409/422 = refetch sha and retry once */
async function putFile(path, text, message) {
  const content = b64utf8(text);
  for (let attempt = 0; attempt < 2; attempt++) {
    const cur = await getRemote(path), sha = cur && cur.sha;
    if (cur && cur.text === text) return true;          // already identical on GitHub: no empty commit
    const r = await gh('PUT', contentsPath(path), sha ? {message, content, sha} : {message, content});
    if (r.ok) return true;
    if ((r.status === 409 || r.status === 422) && attempt === 0) continue;
    if (r.status === 404) throw new SyncError('notfound', 'Repo not found – check owner/repo and that the token can access it.', 404);
    throw new SyncError('http', 'GitHub error ' + r.status + ' writing ' + path, r.status);
  }
}

/* ---------- what gets written ---------- */
function backupJSON() { return JSON.stringify({app:'ip-method-josh', exported:new Date().toISOString(), data:S}, null, 1); }
/* data/sessions/YYYY-MM-DD-day-X.json; a second session with the same date + day gets -2, -3 … (ordered by seq) */
function sessionPaths() {
  const seen = {}, out = {};
  [...S.sessions].sort((a, b) => (a.seq || 0) - (b.seq || 0)).forEach(s => {
    const base = `data/sessions/${s.date}-day-${s.day}`; seen[base] = (seen[base] || 0) + 1;
    out[s.id] = base + (seen[base] > 1 ? '-' + seen[base] : '') + '.json';
  });
  return out;
}
function sessionPath(s) { return sessionPaths()[s.id]; }
function hashStr(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(16) + ':' + str.length; }
/* Every finished session whose file hasn't been written (or whose content changed) – this backfills
   sessions finished before sync was set up, or while a sync failed. */
function sessionsToWrite() {
  const paths = sessionPaths();
  return S.sessions.map(s => { const path = paths[s.id], text = sessionJSON(s); return {s, path, text, h:hashStr(text)}; })
    .filter(x => SYNC.sessFiles[x.path] !== x.h);
}
const syncNeeded = () => syncOn() && (SYNC.pending.state || SYNC.pending.sessions.length > 0 || sessionsToWrite().length > 0);
function sessionJSON(s) {
  const logs = S.logs.filter(l => l.sid === s.id).sort(byDate);
  const exercises = logs.map(l => {
    if (l.acc) return {slot:l.slot, exercise:l.ex, type:'accessory', sets:l.sets.map(x => ({kg:x[0], reps:x[1]}))};
    const lc = LC(l.lc); const row = lc ? evalLc(lc.id).find(r => r.log.id === l.id) : null;
    return {slot:l.slot, exercise:l.ex, role:l.role, week:row ? row.wk : null, topSet:{kg:l.kg, reps:l.reps}, e1RM:row ? row.e1 : e1rm(l.kg, l.reps),
      backOffs:(l.bo || []).map(b => ({kg:b[0], reps:b[1]})), status:row ? row.status : null, nextTopSetKg:row ? row.next : null, note:l.note || ''};
  });
  return JSON.stringify({date:s.date, dateUK:fmtD(s.date), day:s.day, dayName:DAYNAME[s.day], exercises}, null, 2);
}
function summaryMD() {
  let md = `# IP Method – current status\n\nUpdated ${new Date().toLocaleString('en-GB')} · ${S.sessions.length} sessions logged\n\n| Slot | Exercise | Role | Status | Next top set |\n|---|---|---|---|---|\n`;
  Object.keys(S.slots).filter(id => !isAcc(id)).forEach(id => {
    const i = slotInfo(id);
    md += `| ${id} | ${i.sl.ex} | ${i.lc.role} | ${stLabel(i.status)} | ${i.rotate ? 'rotate' : isNum(i.target) ? kgf(i.target) + ' kg' : '–'} |\n`;
  });
  md += `\n## Best 3 per pattern (est. 1RM gained)\n\n`;
  PATTERNS.forEach(p => { const b = best3(p); md += `- **${p}:** ${b.length ? b.map(x => `${x.ex} (${x.best >= 0 ? '+' : ''}${kgf(x.best)} kg)`).join(', ') : 'no finished lifecycles yet'}\n`; });
  return md;
}

/* ---------- queue + run ---------- */
function syncSoon(sid) {
  if (!syncOn()) return;                       // sync optional: nothing happens without a token
  SYNC.pending.state = true;
  if (sid && !SYNC.pending.sessions.includes(sid)) SYNC.pending.sessions.push(sid);
  syncSave(); clearTimeout(syncTimer); syncTimer = setTimeout(() => runSync(), 1200);
}
let syncRun = null;
async function runSync(manual) {
  if (!syncOn()) return false;
  if (syncBusy) { if (!manual) return false; try { await syncRun; } catch (e) { /* ignore */ } return runSync(manual); }   // Sync now during an auto-sync: wait, then run
  syncRun = runSyncOnce(manual); return syncRun;
}
async function runSyncOnce(manual) {
  if (manual) { SYNC.pending.state = true; }
  const todo = sessionsToWrite();
  if (!SYNC.pending.state && !SYNC.pending.sessions.length && !todo.length) return true;
  syncBusy = true; syncIndicator();
  try {
    for (const x of todo) {
      await putFile(x.path, x.text, `Session ${x.s.date} Day ${x.s.day}`);
      SYNC.sessFiles[x.path] = x.h;
      SYNC.pending.sessions = SYNC.pending.sessions.filter(id => id !== x.s.id); syncSave();
    }
    SYNC.pending.sessions = SYNC.pending.sessions.filter(id => S.sessions.some(s => s.id === id));  // drop ids of deleted sessions
    await putFile('data/state.json', backupJSON(), 'Update state backup');
    await putFile('data/summary.md', summaryMD(), 'Update summary');
    SYNC.pending.state = false; SYNC.lastSync = new Date().toISOString(); SYNC.lastError = null; syncSave();
    return true;
  } catch (e) {
    SYNC.lastError = {kind:e.kind || 'error', msg:e.message, at:new Date().toISOString()}; syncSave();
    if (manual || e.kind === 'auth') toast(e.kind === 'auth' ? 'Sync failed: token invalid or missing permission' : 'Sync: ' + e.message);
    return false;
  } finally { syncBusy = false; syncIndicator(); }
}
async function testConnection() {
  const r = await gh('GET', contentsPath('README.md'));
  if (r.status === 404) { const r2 = await gh('GET', `/repos/${encodeURIComponent(SYNC.owner)}/${encodeURIComponent(SYNC.repo)}`); if (r2.status === 404) throw new SyncError('notfound', 'Repo not found – check owner/repo, and that the token was given access to it.', 404); }
  else if (!r.ok) throw new SyncError('http', 'GitHub error ' + r.status, r.status);
  return 'Connected – the token can read ' + SYNC.owner + '/' + SYNC.repo + '. Write access is confirmed on the first sync.';
}
async function fetchRemoteState() {
  const r = await gh('GET', contentsPath('data/state.json'), null, 'application/vnd.github.raw+json');
  if (r.status === 404) throw new SyncError('notfound', 'No data/state.json in the repo yet – sync once first.', 404);
  if (!r.ok) throw new SyncError('http', 'GitHub error ' + r.status, r.status);
  return importText(await r.text());
}
const fmtDT = iso => iso ? new Date(iso).toLocaleString('en-GB', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : 'never';
function syncStatusText() {
  if (!syncOn()) return 'Off – your data stays on this phone only';
  if (syncBusy) return 'Syncing…';
  const pend = (SYNC.pending.state || SYNC.pending.sessions.length || sessionsToWrite().length) ? ' · changes waiting' : '';
  if (SYNC.lastError) return (SYNC.lastError.kind === 'auth' ? '⚠ Token invalid or missing permission' : SYNC.lastError.kind === 'offline' ? 'Offline – will retry' : '⚠ ' + SYNC.lastError.msg) + pend;
  return 'Last synced ' + fmtDT(SYNC.lastSync) + pend;
}
function syncIndicator() { document.querySelectorAll('[data-sync-status]').forEach(el => el.textContent = syncStatusText()); }
function syncInit() {
  syncLoad();
  window.addEventListener('online', () => { if (syncOn()) runSync(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && syncNeeded()) runSync(); });
  setInterval(() => { if (navigator.onLine !== false && syncNeeded()) runSync(); }, 60000);
  setTimeout(() => { if (syncNeeded()) runSync(); }, 1500);   // also backfills missing session files on app open
}

}

const SYNC_ACTIONS = {
  syncsettings: () => openSyncSheet(),
  synctoggle: () => { const t = $('#sy-token'); t.type = t.type === 'password' ? 'text' : 'password'; },
  syncsave: () => {
    const tok = ($('#sy-token').value || '').trim(), owner = ($('#sy-owner').value || '').trim(), repo = ($('#sy-repo').value || '').trim();
    if (!owner || !repo) { toast('Enter owner and repo'); return; }
    if (tok) { SYNC.token = tok; SYNC.lastError = null; }
    if (owner !== SYNC.owner || repo !== SYNC.repo) SYNC.sessFiles = {};   // new repo: write every session file again
    SYNC.owner = owner; SYNC.repo = repo; syncSave();
    openSyncSheet({ok:true, text:SYNC.token ? 'Saved. Tap Test connection to check it.' : 'Saved (no token yet).'}); render();
  },
  synctest: async () => {

    <p class="small mut">Export a local backup first if you might want this phone's data back.</p>

/* ===== main.js ===== */
'use strict';
/* Bottom sheet, toast, rest timer, event wiring, boot */
function openSheet(html) {
  let bg = $('#sheet'); const fresh = !bg;
  if (fresh) { bg = document.createElement('div'); bg.id = 'sheet'; bg.className = 'sheet-bg'; document.body.appendChild(bg); }
  const top = fresh ? 0 : (bg.firstElementChild ? bg.firstElementChild.scrollTop : 0);
  bg.innerHTML = `<div class="sheet${fresh ? ' anim' : ''}" role="dialog"><div class="grab"></div>${html}</div>`;
  bg.firstElementChild.scrollTop = top;
  document.body.style.overflow = 'hidden';
}
function closeSheet() { const bg = $('#sheet'); if (bg) bg.remove(); document.body.style.overflow = ''; SHEETCTX = null; }
let toastT;
function toast(m) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 2600);
}
let TIMER = null;
function startTimer(sec) {
  stopTimer();
  const end = Date.now() + sec * 1000, el = document.createElement('button');
  el.id = 'timer'; el.className = 'timer'; document.body.appendChild(el);
  const tick = () => {
    if (el.classList.contains('done')) return;
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    el.innerHTML = `⏱ ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} <span style="font-size:12px;opacity:.7">✕</span>`;
    if (left === 0) { el.classList.add('done'); el.innerHTML = 'Rest done ✕'; if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }
  };
  tick(); TIMER = setInterval(tick, 500);
}
function stopTimer() { clearInterval(TIMER); TIMER = null; const t = $('#timer'); if (t) t.remove(); }

const ACTIONS = {
  go: v => go(v),
  startday: v => startDay(v),
  discard: () => { if (confirm('Discard this session? Nothing will be saved.')) { S.draft = null; save(); render(); } },
  finish: () => finishSession(),
  discardask: () => { if (S.draft) discardSheet(); },
  discardok: () => { if (S.draft) { const o = parkedGet(); delete o[S.draft.day]; parkedSet(o); S.draft = null; save(); } closeSheet(); render(); scrollTop0(); toast('Session cancelled'); },
  switchday: () => { if (S.draft) switchSheet(); },
  switchto: v => { closeSheet(); if (S.draft && S.draft.day === v) return; parkDraft(); startDay(v); },
  previewgo: v => previewGo(v),
  step: (v, b) => {
    const p = b.dataset.p, inp = b.parentElement.querySelector('input');
    let base = draftGet(p); if (!isNum(base)) base = numOrNull(inp.placeholder); if (!isNum(base)) base = 0;
    const sid = p.split('.')[0], neg = SLOTDEF[sid] && !isAcc(sid) && isAssisted(S.slots[sid].ex);
    const nv = neg ? Math.min(0, r2(base + parseFloat(b.dataset.d))) : Math.max(0, r2(base + parseFloat(b.dataset.d))); const prev = draftGet(p); inp.value = nv; draftSet(p, String(nv));
    if (/^[A-C]\d\.kg$/.test(p)) topChanged(sid, prev, nv);
  },
  tick: (v, b) => {
    const [id, f] = b.dataset.p.split('.'), k = +f.slice(1), e = S.draft.entries[id];
    e.done[k] = !e.done[k]; b.classList.toggle('on', e.done[k]);
    if (e.done[k]) {
      b.parentElement.querySelectorAll('input').forEach(inp => { if (inp.value === '' && inp.placeholder !== '' && !isNaN(parseFloat(inp.placeholder))) { inp.value = parseFloat(inp.placeholder); draftSet(inp.dataset.draft, inp.value); } });
      const last = isAcc(id) ? k === 1 : k === 2;
      if (!last) startTimer(isAcc(id) ? 105 : (k === 0 && SLOTDEF[id].type === 'Key movement' ? 210 : 150));
    }
    save();
  },
  timer: v => startTimer(+v),
  rotate: v => { closeSheet(); rotateFlow(v, false); },
  early: v => { closeSheet(); rotateFlow(v, true); },
  pickreason: v => { SHEETCTX.reason = v; renderRot(); },

  unmanual: () => { SHEETCTX.manual = false; renderRot(); },

    const c = SHEETCTX; let ex = $('#man-ex').value;

  },
  rate: v => { SHEETCTX.rating = +v; document.querySelectorAll('.stars button').forEach(x => x.classList.toggle('on', +x.dataset.v === +v)); },
  confirmrot: () => confirmRotation(),
  usecalc: v => { $('#st-kg').value = v; },
  setstart: v => { closeSheet(); startSheet(v); },
  savestart: () => {

    if (S.draft && S.draft.entries[id] && !lcLogs(lc.id).length) S.draft.entries[id] = draftEntry(id);

  },

  export: () => doExport(),

  close: () => closeSheet()
};
Object.assign(ACTIONS, SYNC_ACTIONS);
// iOS: the event target can be a text node or a child of the button – always resolve to an Element first
const evEl = ev => { let el = ev.target; while (el && el.nodeType !== 1) el = el.parentNode; return el || document.body; };
